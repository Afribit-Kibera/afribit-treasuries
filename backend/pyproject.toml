[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "afribit-clans-backend"
version = "1.7.0"
description = "Afribit Treasuries: non-custodial bitcoin treasuries for savings groups"
license = {text = "AGPL-3.0-only"}
authors = [{name = "Afribit Africa"}]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn>=0.34,<1",
  "psycopg[binary]>=3.2,<4",
  "webauthn>=3.0.1,<4",
  "alembic>=1.20.1,<2",
  "bolt11>=2.2,<3",
  "bitstring>=4.1,<5",
  "cryptography>=50.0.2,<51",
  "bdkpython>=3.1.1,<4",
  "coincurve>=21,<22",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "httpx2>=2,<3"]

[project.scripts]
clans-seed-demo = "clans.seed:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clans = ["data/*.txt", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/clans/api.py" = ["B008"]
