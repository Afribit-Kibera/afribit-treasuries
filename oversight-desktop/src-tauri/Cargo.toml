[package]
name = "afribit-oversight"
version = "0.2.0"
description = "Afribit Oversight: approve clan payouts for your community"
authors = ["Afribit Africa"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.80"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
# No plugins: the screens get one command, `core`, and nothing else.
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
